    <script>
        const TMDB_API_KEY = '60b3801a9e76b5706ee2a432f06423e6';
        const MEDIATHEK_URL = 'https://mediathekviewweb.de/api/query';
        const IPTV_URL = 'https://raw.githubusercontent.com/jnk22/kodinerds-iptv/refs/heads/master/iptv/clean/clean_tv_main.m3u';
        const NEWS_URL = 'https://raw.githubusercontent.com/Chrisophy/Fassbrause/refs/heads/main/news.json';
        
        const GENRES_MAP = {
            28: 'Action', 12: 'Abenteuer', 16: 'Animation', 35: 'Komödie', 80: 'Krimi', 99: 'Doku',
            18: 'Drama', 10751: 'Familie', 14: 'Fantasy', 36: 'Historie', 27: 'Horror', 10402: 'Musik', 
            9648: 'Mystery', 10749: 'Romanze', 878: 'Sci-Fi', 10770: 'TV-Film', 53: 'Thriller', 
            10752: 'Krieg', 37: 'Western'
        };

        const QUERIES = ['Spielfilm', 'Spielfilme', 'Spielfilm-Highlights', 'Filme', 'Kino - Filme', 'Filme in der ARD'];
        
        let allMovies = [];
        let liveTvChannels = [];
        let newsArticles = []; 
        let moviesToRender = []; 
        let favoriteUrls = JSON.parse(localStorage.getItem('gez_kino_favs') || '[]');
        let hideTvMovies = localStorage.getItem('gez_kino_hide_tv') === 'true';
        let currentNewsSource = 'ÖRR';
        let currentGenre = 'Alle';
        let currentView = 'mediathek'; 
        let chunkObserver = null;
        let hlsInstance = null;
        let activeVideoErrorHandler = null; 
        let deferredPrompt = null; 
        let activeDownloadUrl = ''; 
        const CHUNK_SIZE = 60; 

        /* Ergänzte Steuerungsfunktionen */
        function toggleTvMoviesFilter() {
            hideTvMovies = !hideTvMovies;
            localStorage.setItem('gez_kino_hide_tv', hideTvMovies ? 'true' : 'false');
            renderGenreLeiste();
            filterResults();
        }

        function toggleNewsSource() {
            currentNewsSource = currentNewsSource === 'ÖRR' ? 'Sonstige' : 'ÖRR';
            renderGenreLeiste();
            filterResults();
        }

        function seekPlayer(seconds, event) {
            if (event) event.stopPropagation();
            const video = document.getElementById('mainVideoPlayer');
            if (!video) return;

            if (seconds < 0) {
                video.currentTime = Math.max(0, video.currentTime + seconds);
                showHUD(`⏪ ${seconds}s`);
            } else {
                video.currentTime = Math.min(video.duration || 0, video.currentTime + seconds);
                showHUD(`⏩ +${seconds}s`);
            }
        }

        function togglePlayerTouch(event) {
            if (event) event.stopPropagation();
            const video = document.getElementById('mainVideoPlayer');
            if (!video) return;

            if (video.paused) {
                video.play();
                showHUD("▶ PLAY");
            } else {
                video.pause();
                showHUD("⏸ PAUSE");
            }
        }

        function openRatingModal() { document.getElementById('ratingModal').style.display = 'flex'; }
        function closeRatingModal() { document.getElementById('ratingModal').style.display = 'none'; }
        
        function applyRatingFilter(min, max) {
            currentGenre = `Rating: ${min}-${max}`; 
            document.getElementById('ratingModal').style.display = 'none';
            setActiveGenreStyling();
            filterResults();
        }

        function cleanTitle(title) {
            let yearMatch = title.match(/(\d{4})/);
            let year = yearMatch ? yearMatch[1] : 'None';
            
            let clean = title;
            const markers = [
                ' - Spielfilm', ' – Spielfilm', ' - Spiellfilm', ' – Spiellfilm', ', Spielfilm', 
                ' Österreich', ', Deutschland', ', Schweiz', ', Belgien', ', Frankreich', ', Spanien',
                ', Niederlande', ', Irland', ', Luxemburg', ', Italien', ', USA', ', Kosovo', 
                ', Großbritannien', ', Tschechische Republik', ', Norwegen', ', BRD', ', Dänemark', 
                ', Australien', ', Schweden', ', Video:', ', Präsentiert:', ', Kurzfilm', ' Fernsehfilm', 
                ' Heimatfilm', ' - Thriller', ' - Drama', '«', '»'
            ];

            markers.forEach(marker => {
                clean = clean.split(new RegExp(marker, 'i'))[0];
            });

            clean = clean.replace(/^(Spielfilm|Spiellfilm):\s*/i, '');
            clean = clean.replace(/–/g, '-').replace(/—/g, '-');
            clean = clean.replace(/\(.*?\)/g, '');
            clean = clean.trim().replace(/[ \t,.\-_–—»]+$/, '');

            return { cleanName: clean, year: year };
        }

        function getLatestUpdateSlot() {
            const now = new Date();
            const today615AM = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 6, 15, 0, 0);
            const today615PM = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 18, 15, 0, 0);

            if (now >= today615PM) {
                return today615PM.getTime();
            } else if (now >= today615AM) {
                return today615AM.getTime();
            } else {
                const yesterday615PM = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1, 18, 15, 0, 0);
                return yesterday615PM.getTime();
            }
        }

        function shouldFetchFreshData() {
            const lastFetch = parseInt(localStorage.getItem('gez_kino_last_fetch') || '0', 10);
            const latestSlot = getLatestUpdateSlot();
            return lastFetch < latestSlot;
        }

        async function fetchAllData() {
            const cachedData = localStorage.getItem('gez_kino_movies_cache');
            
            if (cachedData && !shouldFetchFreshData()) {
                try {
                    allMovies = JSON.parse(cachedData);
                    document.getElementById('scanner')?.classList.add('hidden');
                    renderGenreLeiste();
                    filterResults();
                    console.log("Filme aus Cache geladen (Nächstes Update um 06:15 / 18:15 Uhr).");
                    return;
                } catch (e) {
                    console.warn("Cache konnte nicht gelesen werden, lade neu...");
                }
            }
        
            document.getElementById('scanner')?.classList.remove('hidden');
            const seenUrls = new Set();
            const seenTitles = new Set();
            let tempResults = [];
        
            try {
                const promises = QUERIES.map(q => {
                    const payload = {
                        queries: [{ fields: ['topic'], query: q }],
                        size: 2000,
                        sortBy: 'timestamp',
                        sortOrder: 'desc'
                    };
                    return fetch(MEDIATHEK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    }).then(res => res.json()).catch(() => ({ result: { results: [] } }));
                });
        
                const responses = await Promise.all(promises);
        
                responses.forEach(data => {
                    const results = data.result?.results || [];
                    results.forEach(m => {
                        const url = m.url_video || '';
                        const title = m.title || '';
                        const channel = m.channel || '';
                        if (!url || !title) return;
                
                        if (channel.toLowerCase().includes('zdf-tivi')) return;
                        if (title.toLowerCase().includes('zdf-tivi') || title.toLowerCase().includes('tivi')) return;
                        if (/audiodeskription|audio description|ad version|hörfilm|deskription|barrierefrei/.test(title.toLowerCase())) return;
                        if (title.includes('(Englisch)')) return;
                        if (title.includes('(Originalversion mit Untertitel)')) return;
                        if (title.includes('(mit Untertitel)')) return;
                        if (title.includes('(Originalversion)')) return;
                        if (/\b(folge|staffel|episode|ep\.|teil)\b/i.test(title)) return;
                        if (/\(\d+(\s*[\/\-]\s*\d+)?\)/.test(title)) return;
                        if (/\b\d{1,2}\/\d{1,2}\b/.test(title)) return;
                        if (seenUrls.has(url)) return;
                        
                        const { cleanName, year } = cleanTitle(title);
                        if (!cleanName) return;
                
                        const normTitle = cleanName.toLowerCase().trim();
                        if (normTitle === 'nö') return; 
                        if (seenTitles.has(normTitle)) return;
                        if (m.duration < 4680) return;
                
                        seenUrls.add(url);
                        seenTitles.add(normTitle);
                
                        tempResults.push({
                            title: cleanName,
                            search: cleanName,
                            year: year,
                            video_url: url,
                            plot: 'Lade Filminformationen...',
                            mediathek_desc: m.description || '',
                            director: '',
                            actors: [],
                            rating: 'N/A',
                            thumb: 'placeholder.png', 
                            genres_list: ['Sonstige'],
                            channel: m.channel,
                            timestamp: m.timestamp || 0,
                            isNew: false
                        });
                    });
                });
        
                const sortedByTime = [...tempResults].sort((a, b) => b.timestamp - a.timestamp);
                const newestUrls = new Set(sortedByTime.slice(0, 100).map(m => m.video_url));
                
                tempResults.forEach(m => {
                    if (newestUrls.has(m.video_url)) {
                        m.isNew = true;
                    }
                });
        
                allMovies = tempResults.sort((a, b) => a.title.localeCompare(b.title));
                
                if (allMovies.length === 0 && currentView === 'mediathek') {
                    document.getElementById('statusMessage').innerText = "Keine Filme gefunden.";
                    return;
                }
        
                renderGenreLeiste();
                filterResults();                
                await hydrateWithTMDBParallel();
        
                localStorage.setItem('gez_kino_last_fetch', Date.now().toString());
                localStorage.setItem('gez_kino_movies_cache', JSON.stringify(allMovies));
        
            } catch (err) {
                console.error(err);
                if (currentView === 'mediathek') {
                    document.getElementById('statusMessage').innerText = "Fehler beim API-Abruf.";
                }
            }
        }

        async function fetchLiveTvData() {
            if (liveTvChannels.length > 0) return;
            document.getElementById('scanner')?.classList.remove('hidden');
            
            try {
                const res = await fetch(IPTV_URL);
                const text = await res.text();
                const lines = text.split(/\r?\n/);
                let currentChannel = null;

                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const commaIdx = line.indexOf(',');
                        const name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Unbekannter Sender';
                        
                        currentChannel = {
                            title: name,
                            search: name,
                            year: 'LIVE',
                            video_url: '',
                            plot: 'Live-Stream des öffentlich-rechtlichen Rundfunks über das Kodinerds IPTV-Projekt.',
                            director: '', actors: [],
                            rating: 'TV',
                            thumb: logoMatch ? logoMatch[1] : 'placeholder.png',
                            genres_list: ['Live TV'],
                            channel: 'ÖRR'
                        };
                    } else if (line.startsWith('http') && currentChannel) {
                        currentChannel.video_url = line;
                        liveTvChannels.push(currentChannel);
                        currentChannel = null;
                    }
                }
                liveTvChannels.sort((a, b) => a.title.localeCompare(b.title));
            } catch (err) {
                console.error("Fehler beim IPTV-Parsing:", err);
            } finally {
                document.getElementById('scanner')?.classList.add('hidden');
            }
        }

        async function fetchNewsData() {
            if (newsArticles.length > 0) return;

            try {
                const res = await fetch(NEWS_URL);
                const data = await res.json();

        async function hydrateWithTMDBParallel() {
            const CONCURRENCY_LIMIT = 10;
            let movieIndex = 0;
            let loadedCount = 0;
            const totalMovies = allMovies.length;

            const scannerText = document.getElementById('scanner-text');
            const scannerPercent = document.getElementById('scanner-percent');

            async function worker() {
                while (movieIndex < allMovies.length) {
                    const currentIdx = movieIndex++;
                    const movie = allMovies[currentIdx];
                    if (!movie) break;

                    let movieUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movie.search)}&language=de-DE&include_adult=false`;
                    if (movie.year !== 'None') movieUrl += `&year=${movie.year}`;
                    
                    try {
                        let res = await fetch(movieUrl);
                        if (res.status === 429) {
                            movieIndex--;
                            await new Promise(resolve => setTimeout(resolve, 800));
                            continue;
                        }
                        let data = await res.json();
                        let tmdb = null;
                        let isTvShow = false;

                        if ((!data.results || data.results.length === 0) && movie.year !== 'None') {
                            let fallbackUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movie.search)}&language=de-DE&include_adult=false`;
                            const fallbackRes = await fetch(fallbackUrl);
                            data = await fallbackRes.json();
                        }

                        if (data.results && data.results.length > 0) {
                            if (movie.year === 'None' && data.results.length > 1) {
                                let bestMatch = data.results[0];
                                let highestScore = 0;
                                const mDesc = movie.mediathek_desc.toLowerCase();
                                const candidates = data.results.slice(0, 5);
                                const scoredCandidates = await Promise.all(candidates.map(async (candidate) => {
                                    let score = 0;
                                    const cOverview = (candidate.overview || '').toLowerCase();

                                    if (cOverview && mDesc) {
                                        const words = cOverview.split(/\s+/).filter(w => w.length > 4);
                                        words.forEach(w => {
                                            if (mDesc.includes(w)) score += 2;
                                        });
                                    }
                                    try {
                                        const credRes = await fetch(`https://api.themoviedb.org/3/movie/${candidate.id}?api_key=${TMDB_API_KEY}&language=de-DE&append_to_response=credits`);
                                        const credData = await credRes.json();
                                        if (credData.credits) {
                                            const directors = credData.credits.crew.filter(c => c.job === 'Director').map(d => d.name.toLowerCase());
                                            directors.forEach(d => {
                                                if (mDesc.includes(d) || d.split(' ').every(part => mDesc.includes(part))) score += 50;
                                            });
                                            const actors = credData.credits.cast.slice(0, 5).map(a => a.name.toLowerCase());
                                            actors.forEach(a => {
                                                if (mDesc.includes(a)) score += 15;
                                            });
                                        }
                                    } catch(e) {}

                                    return { candidate, score };
                                }));

                                scoredCandidates.forEach(item => {
                                    if (item.score > highestScore) {
                                        highestScore = item.score;
                                        bestMatch = item.candidate;
                                    }
                                });
                                tmdb = bestMatch;
                            } else {
                                tmdb = data.results[0];
                            }
                        }

                        if (!tmdb) {
                            let tvUrl = `https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movie.search)}&language=de-DE&include_adult=false`;
                            if (movie.year !== 'None') tvUrl += `&first_air_date_year=${movie.year}`;
    
                            const tvRes = await fetch(tvUrl);
                            const tvData = await tvRes.json();
                            if (tvData.results && tvData.results.length > 0) {
                                tmdb = tvData.results[0];
                                isTvShow = true;
                            }
                        }

                        if (tmdb) {
                            if (tmdb.genre_ids && tmdb.genre_ids.includes(16)) {
                                const lowerTitle = movie.title.toLowerCase();
                                const lowerOverview = (tmdb.overview || "").toLowerCase();
                                const realFilmKeywords = ['tatort', 'polizeiruf', 'in aller freundschaft', 'rosenheim-cops', 'krimi', 'fernsehfilm', 'kommissar', 'drama', 'spielfilm'];
                                const isStrictlyRealfilm = realFilmKeywords.some(keyword => lowerTitle.includes(keyword) || lowerOverview.includes(keyword) || movie.mediathek_desc.toLowerCase().includes(keyword));
                                
                                if (isStrictlyRealfilm) {
                                    tmdb.genre_ids = tmdb.genre_ids.filter(id => id !== 16);
                                }
                            }

                            const mediaType = isTvShow ? 'tv' : 'movie';
                            let creditsUrl = `https://api.themoviedb.org/3/${mediaType}/${tmdb.id}?api_key=${TMDB_API_KEY}&language=de-DE&append_to_response=credits`;
                            const detailsRes = await fetch(creditsUrl);
                            const detailsData = await detailsRes.json();
                            movie.plot = tmdb.overview || movie.mediathek_desc || 'Keine Beschreibung verfügbar.';
                            movie.rating = tmdb.vote_average ? tmdb.vote_average.toFixed(1) : 'N/A';
                            movie.thumb = tmdb.poster_path ? `https://image.tmdb.org/t/p/w342${tmdb.poster_path}` : 'placeholder.png';
                            
                            if (detailsData.credits) {
                                const dir = detailsData.credits.crew.find(c => c.job === 'Director' || c.job === 'Executive Producer');
                                movie.director = dir ? dir.name : '';
                                movie.actors = detailsData.credits.cast.slice(0, 3).map(a => a.name);
                            }

                            const dateStr = tmdb.release_date || tmdb.first_air_date;
                            if (dateStr && movie.year === 'None') {
                                movie.year = dateStr.split('-')[0];
                            }

                            if (tmdb.genre_ids) {
                                movie.genres_list = tmdb.genre_ids
                                    .map(id => GENRES_MAP[id])
                                    .filter(g => g !== undefined);
                                if (movie.genres_list.length === 0) movie.genres_list = ['Sonstige'];
                            }

                            if (currentView === 'mediathek') {
                                updateMovieCard(movie);
                            }
                        }
                    } catch (e) {
                        console.error("TMDB-Fehler bei: " + movie.search, e);
                    }

                    loadedCount++;
                    
                    if (totalMovies > 0) {
                        const percent = Math.round((loadedCount / totalMovies) * 100);
                        if (scannerText) scannerText.innerText = `Lade Mediathek-Daten (${percent}%)...`;
                        if (scannerPercent) scannerPercent.innerText = `${percent}%`;
                    }

                    if (loadedCount % 15 === 0) {
                        updateGenreCounts();
                    }
                }
            }

            const workers = Array.from({ length: CONCURRENCY_LIMIT }, worker);
            await Promise.all(workers);
            updateGenreCounts();
            document.getElementById('scanner')?.classList.add('hidden');
        }

        function getGenreCounts() {
            const counts = { "Alle": 0, "Neu hinzugefügt": 0, "Sonstige": 0, "Nach Jahren": 0, "Nach Bewertung": 0, "⭐ Favoriten": 0 };
            Object.values(GENRES_MAP).forEach(g => counts[g] = 0);
        
            let currentSet = allMovies;
            if (currentView === 'livetv') currentSet = liveTvChannels;
            if (currentView === 'news') currentSet = newsArticles;
        
            currentSet.forEach(m => {
                if (hideTvMovies && currentView === 'mediathek') {
                    const titleLower = m.title.toLowerCase();
                    const descLower = m.mediathek_desc ? m.mediathek_desc.toLowerCase() : '';
                    const genresLower = m.genres_list ? m.genres_list.map(g => g.toLowerCase()) : [];
        
                    if (titleLower.includes('tv-film') || titleLower.includes('tv film') || 
                        descLower.includes('tv-film') || descLower.includes('tv film') || 
                        genresLower.includes('tv-film')) {
                        return;
                    }
                }                
        
                if (currentView === 'news') {
                    const source = m.source || m.channel;
                    if (source !== currentNewsSource) return;

                    counts["Alle"]++;
                    if (favoriteUrls.includes(m.video_url)) counts["⭐ Favoriten"]++;

                    if (m.genres_list) {
                        m.genres_list.forEach(g => {
                            if (!counts[g]) counts[g] = 0;
                            counts[g]++;
                        });
                    }
                } else {
                    counts["Alle"]++;
                    if (favoriteUrls.includes(m.video_url)) {
                        counts["⭐ Favoriten"]++;
                    }
                    if (currentView === 'mediathek') {
                        if (m.isNew) {
                            counts["Neu hinzugefügt"]++;
                        }
                        if (m.year && m.year !== 'None' && parseInt(m.year) > 1900) {
                            counts["Nach Jahren"]++;
                        }
                        if (m.rating && m.rating !== 'N/A' && parseFloat(m.rating) > 0) {
                             counts["Nach Bewertung"]++;
                        }
                        if (!m.genres_list || m.genres_list.includes('Sonstige')) {
                            counts["Sonstige"]++;
                        } else {
                            m.genres_list.forEach(g => { if (g in counts) counts[g]++; });
                        }
                    }
                }
            });
            return counts;
        }

        function renderGenreLeiste() {
            const leiste = document.getElementById('genreLeiste');
            const counts = getGenreCounts();
            
            let genres = [];
            if (currentView === 'mediathek') {

            } else if (currentView === 'news') {
                const newsCats = new Set();
                newsArticles.forEach(m => {
                    const source = m.source || m.channel;
                    if (source === currentNewsSource && m.genres_list) {
                        m.genres_list.forEach(g => newsCats.add(g));
                    }
                });
                genres = ['News-Quelle-Umschalter', 'Alle', '⭐ Favoriten', ...Array.from(newsCats).sort()];

                genres = ['Alle', '⭐ Favoriten'];
            }

            leiste.innerHTML = '';

                    btn.onclick = toggleNewsSource;

                    const spanLabel = document.createElement('span');

                    spanLabel.className = "text-xs tracking-wide font-bold";
                    
                    const spanSub = document.createElement('span');
                    spanSub.className = "text-[9px] opacity-60 font-medium";
                    spanSub.innerText = hideTvMovies ? "(Inaktiv)" : "(Aktiv)";
                    
                    if (hideTvMovies) {
                        spanLabel.innerText = "TV-Filme";
                        btn.classList.add('bg-amber-600/10', 'border-amber-500/30', 'text-amber-400');
                    } else {
                        spanLabel.innerText = "TV-Filme";
                        btn.classList.add('bg-gray-900', 'border-gray-800', 'text-gray-400', 'hover:border-gray-700');
                    }
                    
                    btn.appendChild(spanLabel);
                    btn.appendChild(spanSub);
                } else {
                    const cleanId = g.replace(/\s+/g, '').replace(/⭐/g, 'Fav').replace(/🆕/g, 'Neu').replace(/[^a-zA-Z0-9]/g, '');
                    btn.id = `genre-btn-${cleanId}`;
                    
                    const isActive = currentGenre === g || (g === 'Nach Jahren' && currentGenre.startsWith('Jahr: ')) || (g === 'Nach Bewertung' && currentGenre.startsWith('Rating: '));
                    
                    btn.className = `flex-shrink-0 min-w-[110px] px-3.5 py-1.5 rounded-xl text-center flex flex-col justify-center transition-all cursor-pointer border ${
                        isActive ? 'bg-blue-600 border-blue-500 text-white font-bold shadow-md active-glow' : 'bg-gray-900/90 border-gray-800 text-gray-300 hover:border-gray-700'
                    }`;

                    let displayLabel = g;
                    if (g === 'Nach Bewertung' && currentGenre.startsWith('Rating: ')) displayLabel = currentGenre;
                    if (g === 'Nach Jahren' && currentGenre.startsWith('Jahr: ')) displayLabel = currentGenre.replace('Jahr: ', 'Jahr ');

                    btn.innerHTML = `
                        <span class="text-xs tracking-wide font-bold">${displayLabel}</span>
                        <span class="text-[9px] opacity-60 font-medium genre-count">${counts[g] !== undefined ? '(' + counts[g] + ')' : '(0)'}</span>
                    `;

                    btn.onclick = () => {
                        if (g === 'Nach Jahren') {
                            openYearsMenu();
                        } else if (g === 'Nach Bewertung') {
                            openRatingModal();
                        } else {
                            currentGenre = g;
                            document.getElementById('searchBar').value = '';
                            setActiveGenreStyling();
                            filterResults();
                        }
                    };
                }
                leiste.appendChild(btn);
            });
        }

        function updateGenreCounts() {
            const counts = getGenreCounts();
            Object.keys(counts).forEach(g => {
                const cleanId = g.replace(/\s+/g, '').replace(/⭐/g, 'Fav').replace(/🆕/g, 'Neu').replace(/[^a-zA-Z0-9]/g, '');
                const btn = document.getElementById(`genre-btn-${cleanId}`);
                if (btn) {
                    const countSpan = btn.querySelector('.genre-count');
                    if (countSpan) countSpan.innerText = `(${counts[g] || 0})`;
                }
            });

            const tvBtn = document.getElementById('btnToggleTvMovies');
            if (tvBtn) {
                const subSpan = tvBtn.querySelector('span:not(#lblTvMovies)');
                if (subSpan) subSpan.innerText = hideTvMovies ? "(Inaktiv)" : "(Aktiv)";
            }
        }

                });

            } else {

            }
            
            genres.forEach(g => {

        function generateCreditsHtml(director, actors) {

            if (director) {

        function filterResults() {
            const query = document.getElementById('searchBar').value.toLowerCase().trim();
            let currentSet = allMovies;
            
            if (currentView === 'livetv') currentSet = liveTvChannels;
            if (currentView === 'news') currentSet = newsArticles;
            
            moviesToRender = currentSet.filter(m => {
                if (hideTvMovies && currentView === 'mediathek') {
                    const titleLower = m.title.toLowerCase();
                    const descLower = m.mediathek_desc ? m.mediathek_desc.toLowerCase() : '';
                    const genresLower = m.genres_list ? m.genres_list.map(g => g.toLowerCase()) : [];

                    if (titleLower.includes('tv-film') || titleLower.includes('tv film') || 
                        descLower.includes('tv-film') || descLower.includes('tv film') || 
                        genresLower.includes('tv-film')) {
                        return false;
                    }
                }

                if (currentView === 'news') {
                    const source = m.source || m.channel;
                    if (source !== currentNewsSource) return false;
                }

                let matchQuery = true;

                if (query) {
                    const matchesTitle = m.title.toLowerCase().includes(query);
                    const matchesPlot = m.plot.toLowerCase().includes(query);
                    const matchesDirector = m.director ? m.director.toLowerCase().includes(query) : false;
                    const matchesActors = m.actors ? m.actors.some(a => a.toLowerCase().includes(query)) : false;
                    matchQuery = matchesTitle || matchesPlot || matchesDirector || matchesActors;
                }
                if (!matchQuery) return false;
                if (currentGenre === 'Alle') return true;
                
                if (currentGenre.startsWith('Rating: ')) {
                    const range = currentGenre.replace('Rating: ', '').split('-');
                    const min = parseFloat(range[0]);
                    const max = parseFloat(range[1]);
                    const rat = parseFloat(m.rating);
                    return !isNaN(rat) && rat >= min && rat <= max;
                }
                
                if (currentGenre === '⭐ Favoriten') return favoriteUrls.includes(m.video_url);
                if (currentGenre === 'Neu hinzugefügt') return m.isNew;
                
                if (currentView === 'mediathek') {
                    if (currentGenre === 'Sonstige') return !m.genres_list || m.genres_list.includes('Sonstige');
                    if (currentGenre.startsWith('Jahr: ')) {
                        return m.year === currentGenre.replace('Jahr: ', '');
                    }
                    return m.genres_list && m.genres_list.includes(currentGenre);
                }
                if (currentView === 'news') {
                    return m.genres_list && m.genres_list.includes(currentGenre);
                }
                return true;
            });
        
            if (currentGenre === 'Neu hinzugefügt') {
                moviesToRender.sort((a, b) => a.timestamp - b.timestamp);
            } else if (currentGenre.startsWith('Rating: ') || currentGenre.startsWith('Jahr: ')) {
                moviesToRender.sort((a, b) => {
                    const ratingA = parseFloat(a.rating) || 0;
                    const ratingB = parseFloat(b.rating) || 0;
                    return ratingB - ratingA; 
                });
            } else if (currentView === 'mediathek') {
                moviesToRender.sort((a, b) => a.title.localeCompare(b.title));
            }
        
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
        
            if (moviesToRender.length === 0) {
                grid.innerHTML = `<div class="text-center col-span-full py-20 text-gray-500 font-medium">Keine Inhalte für diese Auswahl vorhanden.</div>`;
                return;
            }
        
            renderNextChunk(0);
            setupInfiniteScroll();
        }

            const fragment = document.createDocumentFragment();

                const card = document.createElement('div');
                const uniqueCardId = m.id || btoa(encodeURIComponent(m.video_url)).replace(/=/g, '');

                const escapedTitle = m.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                const isFav = favoriteUrls.includes(m.video_url);
                const isDirectVideo = m.video_url.match(/\.(mp4|m3u8|mkv|avi)(\?.*)?$/i);
                
                const clickAction = (isNews && !isDirectVideo) 
                    ? `openNewsModal('${m.id}')`

                const buttonText = (isNews && !isDirectVideo) ? 'LESEN' : 'ABSPIELEN';

                let badgeClass = "text-yellow-400 border-yellow-500/30";
                let badgeText = `★ ${m.rating}`;
                if (isTv) { badgeClass = "text-red-400 border-red-500/30"; badgeText = "🔴 LIVE"; }
                if (isNews) { badgeClass = "text-blue-400 border-blue-500/30"; badgeText = m.source || m.channel || "News"; }

                const plotClickAction = isNews ? `openNewsModal('${m.id}')` : 'togglePlot(this)';
                const plotTitleHint = isNews ? 'Klicken, um den ganzen Artikel zu lesen' : 'Klicken, um die Beschreibung & Credits zu erweitern';

                let creditsHtml = '';
                if (!isTv && !isNews && (m.director || (m.actors && m.actors.length > 0))) {

                             onerror="if(!this.src.includes('placeholder.png'))this.src='placeholder.png';">
                        <span class="absolute top-2 right-2 bg-black/70 backdrop-blur-md px-2 py-0.5 text-[10px] font-bold ${badgeClass} rounded-lg border">
                            ${badgeText}
                        </span>
                    </div>
                    <div class="p-3 sm:p-3.5 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-xs sm:text-sm text-gray-100 line-clamp-2 mb-1 group-hover:text-blue-400 transition-colors" title="${m.title}">${m.title}</h3>
                            <p class="text-gray-500 text-[10px] sm:text-[11px] mb-2 font-medium">${m.channel} · ${m.year}</p>

                            <div class="flex flex-wrap gap-1 mb-2">
                                ${m.genres_list.map(g => `<span class="bg-gray-800/80 text-gray-400 text-[9px] px-1.5 py-0.5 rounded-md font-medium border border-gray-700/30">${g}</span>`).join('')}
                            </div>
                            <button tabindex="0" onclick="${clickAction}" 
                                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-3 rounded-xl transition-all text-xs tracking-wider cursor-pointer shadow-md active-glow">
                                ${buttonText}

                fragment.appendChild(card);
            });

            grid.appendChild(fragment);

            if (endIndex < moviesToRender.length) {
                const sentinel = document.createElement('div');
                sentinel.id = 'scrollSentinel';
                sentinel.className = 'w-full h-12 col-span-full flex justify-center items-center';
                grid.appendChild(sentinel);
                
                if (chunkObserver) chunkObserver.observe(sentinel);
            }
        }

        function setupInfiniteScroll() {
            if (chunkObserver) chunkObserver.disconnect();

            chunkObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    const currentCount = document.querySelectorAll('#movieGrid > div:not(#scrollSentinel)').length;
                    if (currentCount < moviesToRender.length) {
                        renderNextChunk(currentCount);
                    }
                }
            }, { rootMargin: '400px' });

            const sentinel = document.getElementById('scrollSentinel');
            if (sentinel) chunkObserver.observe(sentinel);
        }

        function playMovieRoulette() {
            if (currentView !== 'mediathek') {
                switchView('mediathek');
            }

            const validMovies = allMovies.filter(movie => {
                const r = parseFloat(movie.rating);
                return !isNaN(r) && r >= 5.0 && r <= 10.0;
            });

            if (validMovies.length === 0) {
                alert("Gerade keine Filme mit einer Bewertung zwischen 5 und 10 geladen.");
                return;
            }

            const btn = document.getElementById('btnRoulette');
            const searchBar = document.getElementById('searchBar');
            const originalBtnText = btn.innerHTML;
            let counter = 0;
    
            btn.disabled = true;
            btn.classList.add('animate-pulse');

            const interval = setInterval(() => {
                const randomTickerMovie = validMovies[Math.floor(Math.random() * validMovies.length)];
                searchBar.value = `🎲 ${randomTickerMovie.title}...`;
                counter++;

                if (counter > 12) { 
                    clearInterval(interval);
            
                    const luckyMovie = validMovies[Math.floor(Math.random() * validMovies.length)];
                    searchBar.value = '';
            
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                    btn.classList.remove('animate-pulse');
            
                    document.getElementById('rouletteModalTitle').innerText = luckyMovie.title;
                    document.getElementById('rouletteModalRating').innerText = `★ ${luckyMovie.rating}`;
                    document.getElementById('rouletteModalMeta').innerText = `${luckyMovie.channel} · ${luckyMovie.year}`;
                    document.getElementById('rouletteModalPlot').innerText = luckyMovie.plot || 'Keine Beschreibung verfügbar.';

                    const creditsContainer = document.getElementById('rouletteModalCredits');
                    if (luckyMovie.director || (luckyMovie.actors && luckyMovie.actors.length > 0)) {
                        creditsContainer.classList.remove('hidden');
                        creditsContainer.innerHTML = generateCreditsHtml(luckyMovie.director, luckyMovie.actors);
                    } else {
                        creditsContainer.classList.add('hidden');
                    }

                    const genreContainer = document.getElementById('rouletteModalGenres');
                    if (luckyMovie.genres_list && luckyMovie.genres_list.length > 0) {
                        genreContainer.innerHTML = luckyMovie.genres_list
                            .map(g => `<span class="bg-gray-800 text-gray-400 text-[10px] px-1.5 py-0.5 rounded font-medium">#${g}</span>`)
                            .join('');
                    } else {
                        genreContainer.innerHTML = '<span class="bg-gray-800 text-gray-400 text-[10px] px-1.5 py-0.5 rounded font-medium">Sonstige</span>';
                    }

                    const thumbImg = document.getElementById('rouletteModalThumb');
                    thumbImg.src = luckyMovie.thumb;
                    thumbImg.onerror = () => { thumbImg.src = 'placeholder.png'; };

                    const escapedTitle = luckyMovie.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                    };

                }
            }, 80);

        function openPlayer(url, title) {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('mainVideoPlayer');
        
            activeDownloadUrl = url; 
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        
            history.pushState({ playerOpen: true }, '');
        
            if (activeVideoErrorHandler) {
                video.removeEventListener('error', activeVideoErrorHandler);
                activeVideoErrorHandler = null;
            }
        
            const isM3u8 = url.includes('.m3u8') || url.endsWith('.m3u8');
            if (isM3u8) {
                if (Hls.isSupported()) {
                    if (hlsInstance) hlsInstance.destroy();
                    hlsInstance = new Hls({ manifestLoadingTimeOut: 5000, manifestLoadingMaxRetry: 2 });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                }
            } else {
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
                video.src = url;
            }
        
            video.controls = false;
        
            video.play().then(() => {
                video.focus();
                setTimeout(() => {
                    video.blur();
                }, 100);
        
                if (modal.requestFullscreen) {
                    modal.requestFullscreen().catch(() => {});
                } else if (modal.webkitRequestFullscreen) {
                    modal.webkitRequestFullscreen();
                }
            }).catch(err => console.log("Autoplay blockiert:", err));
        }
        
        function closePlayer() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('mainVideoPlayer');
            
            activeDownloadUrl = '';
        
            if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        
            if (activeVideoErrorHandler) {
                video.removeEventListener('error', activeVideoErrorHandler);
                activeVideoErrorHandler = null;
            }
            video.onerror = null;
            video.pause();
            
            if (hlsInstance) {
                hlsInstance.off(Hls.Events.ERROR);
                hlsInstance.destroy();
                hlsInstance = null;
            }
            
            video.src = ""; 
            try { video.load(); } catch(e) {} 
            
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        
            if (history.state && history.state.playerOpen) {
                history.back();
            }
        }
        
        window.addEventListener('popstate', (e) => {
            const modal = document.getElementById('videoModal');
            if (modal && !modal.classList.contains('hidden')) {
                closePlayer();
            }
        });
        
        // HUD Anzeigen Funktion
        let hudTimeout;
        function showHUD(text) {
            const hud = document.getElementById('playerHUD');
            const status = document.getElementById('hudStatus');
            const time = document.getElementById('hudTime');
            const vol = document.getElementById('hudVol');
            const video = document.getElementById('mainVideoPlayer');

            if (!hud || !video) return;

            if (text) status.innerText = text;
            
            const curMins = Math.floor(video.currentTime / 60).toString().padStart(2, '0');
            const curSecs = Math.floor(video.currentTime % 60).toString().padStart(2, '0');
            const durMins = Math.floor((video.duration || 0) / 60).toString().padStart(2, '0');
            const durSecs = Math.floor((video.duration || 0) % 60).toString().padStart(2, '0');
            
            time.innerText = `${curMins}:${curSecs} / ${durMins}:${durSecs}`;
            vol.innerText = `🔊 ${Math.round(video.volume * 100)}%`;

            hud.style.opacity = '1';
            clearTimeout(hudTimeout);
            hudTimeout = setTimeout(() => {
                hud.style.opacity = '0';
            }, 2500);
        }

        // Keydown Listener für Videoplayer
        window.addEventListener('keydown', (e) => {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('mainVideoPlayer');

            if (!modal || modal.classList.contains('hidden')) return;

            if (e.key === 'ArrowDown' || e.key === 'Escape' || e.key === 'BackSpace' || e.keyCode === 10009 || e.keyCode === 461) {
                e.preventDefault();
                closePlayer();
                return;
            }

            if (e.key === 'ArrowUp') {
                e.preventDefault();
                showHUD();
                return;
            }

            if (e.key === ' ' || e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                if (video.paused) {
                    video.play();
                    showHUD("▶ PLAY");
                } else {
                    video.pause();
                    showHUD("⏸ PAUSE");
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                video.currentTime = Math.max(0, video.currentTime - 60);
                showHUD("⏪ -60s");
                return;
            }

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                video.currentTime = Math.min(video.duration || 0, video.currentTime + 60);
                showHUD("⏩ +60s");
                return;
            }
        });

        // Smart-TV Navigation
        const topElements = ['searchBar', 'btnMediathek', 'btnLiveTv', 'btnNews'];
        topElements.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        const firstGenreBtn = document.querySelector('#genreLeiste button');
                        if (firstGenreBtn) firstGenreBtn.focus();
                    }
                });
            }
        });

        // App Initialisierung
        document.addEventListener('DOMContentLoaded', () => {
            fetchAllData();
        });
    </script>
</body>
</html>
