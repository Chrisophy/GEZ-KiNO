    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #121212; color: #e5e7eb; font-family: 'Roboto', sans-serif; }

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    <meta name="theme-color" content="#121212">

<body class="p-4 md:p-6 max-w-7xl mx-auto">

    <header class="mb-4 flex flex-col gap-4">
        <div class="w-full rounded-2xl overflow-hidden shadow-xl border border-gray-800 bg-gray-950 aspect-[4/1] md:aspect-[6/1] max-h-[180px]">
            <img src="banner.png" alt="" class="w-full h-full object-contain" onerror="this.style.display='none'">
        </div>
        
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 w-full">
            <div class="flex flex-wrap gap-2 bg-gray-950 p-1.5 rounded-2xl border border-gray-800 w-full sm:w-auto">
                <button id="btnMediathek" onclick="switchView('mediathek')" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold shadow-lg transition-all cursor-pointer text-sm flex-1 sm:flex-none text-center">
                    🍿 Mediathek
                </button>
                <button id="btnLiveTv" onclick="switchView('livetv')" class="px-5 py-2.5 rounded-xl bg-gray-900 border border-gray-800 text-gray-400 hover:text-white transition-all cursor-pointer text-sm flex-1 sm:flex-none text-center">
                    📺 Live TV
                </button>
                <button id="btnNachrichten" onclick="switchView('nachrichten')" class="px-5 py-2.5 rounded-xl bg-gray-900 border border-gray-800 text-gray-400 hover:text-white transition-all cursor-pointer text-sm flex-1 sm:flex-none text-center">
                    📰 Nachrichten
                </button>
                <button id="btnInstallPWA" class="hidden px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-lg transition-all cursor-pointer text-sm flex-1 sm:flex-none text-center animate-pulse">
                    📲 App laden
                </button>
            </div>

            <div class="w-full sm:w-1/3">
                <input type="text" id="searchBar" placeholder="Suchen..." 
                       class="bg-gray-900 text-white px-4 py-2.5 rounded-xl w-full focus:outline-none focus:ring-2 focus:ring-blue-500 border border-gray-800 shadow-inner text-sm">
            </div>
        </div>
    </header>

    <nav id="genreLeiste" class="flex gap-3 overflow-x-auto pb-3 mb-4 no-scrollbar scroll-smooth">
    </nav>

    <div id="scanner" class="w-full h-1 bg-gray-950 mb-6 relative overflow-hidden hidden">
        <div class="h-full bg-blue-500 w-1/4 absolute rounded" style="animation: shift 1.5s infinite ease-in-out;"></div>
    </div>
    <style>
        @keyframes shift { 0% { left: -25%; } 50% { left: 100%; } 100% { left: -25%; } }
    </style>

    <main id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
        <div id="statusMessage" class="text-center col-span-full py-12 text-gray-400 animate-pulse">
            Initialisiere Mediathek-Abruf...
        </div>
    </main>

    <div id="yearsModal" class="fixed inset-0 bg-black/80 hidden z-40 justify-center items-center p-4 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-lg w-full p-6 flex flex-col max-h-[80vh]">
            <h2 class="text-xl font-bold mb-4 text-center text-gray-100">Wähle ein Produktionsjahr</h2>
            <div id="yearsGrid" class="grid grid-cols-3 gap-3 overflow-y-auto pr-2 flex-1 mb-4">
            </div>
            <button onclick="closeYearsModal()" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl transition-colors cursor-pointer">
                ZURÜCK
            </button>
        </div>
    </div>

    <div id="videoModal" class="fixed inset-0 bg-black/95 hidden z-50 flex flex-col justify-center items-center backdrop-blur-md">
        <button onclick="closePlayer()" class="absolute top-4 right-4 text-white hover:text-gray-400 p-2 z-50 bg-gray-900/50 rounded-full border border-gray-800 transition-colors cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <div class="w-full max-w-5xl px-4 flex flex-col gap-3">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 px-1">
                <h3 id="videoTitle" class="text-white text-base md:text-lg font-bold truncate w-full sm:max-w-[60%]"></h3>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button id="modalCopyBtn" onclick="copyVideoUrl()" 
                            class="hidden bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-xl text-xs font-bold transition-all items-center gap-1.5 cursor-pointer border border-gray-700 shadow-lg whitespace-nowrap">
                        🔗 Link kopieren
                    </button>
                    <button id="modalDownloadBtn" onclick="triggerNativeDownload()" 
                       class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold transition-all items-center gap-1.5 cursor-pointer shadow-lg whitespace-nowrap">
                        📥 Download
                    </button>
                </div>
            </div>
            <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-2xl">
                <video id="mainVideoPlayer" controls autoplay class="w-full h-full"></video>
            </div>
        </div>
    </div>

    <div id="textModal" class="fixed inset-0 bg-black/90 hidden z-50 flex flex-col justify-center items-center backdrop-blur-md p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-3xl w-full p-6 flex flex-col max-h-[85vh] shadow-2xl relative">
            <button onclick="closeTextModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white p-2 bg-gray-800 rounded-full border border-gray-700 transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h2 id="textModalTitle" class="text-xl font-bold mb-2 text-gray-100 pr-12 line-clamp-2"></h2>
            <div class="w-full h-px bg-gray-800 mb-4"></div>
            <div id="textModalContent" class="overflow-y-auto text-gray-300 font-light leading-relaxed pr-2 space-y-4 text-sm md:text-base whitespace-pre-line flex-1">
            </div>
            <div class="mt-4 pt-4 border-t border-gray-800 flex justify-end">
                <a id="textModalLink" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-colors shadow-lg">
                    🌐 Original Artikel auf BILD.de öffnen
                </a>
            </div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = '60b3801a9e76b5706ee2a432f06423e6';
        const MEDIATHEK_URL = 'https://mediathekviewweb.de/api/query';
        const IPTV_URL = 'https://raw.githubusercontent.com/jnk22/kodinerds-iptv/refs/heads/master/iptv/clean/clean_tv_main.m3u';
        
        const GENRES_MAP = {
            28: 'Action', 12: 'Abenteuer', 16: 'Animation', 35: 'Komödie', 80: 'Krimi', 99: 'Doku',
            18: 'Drama', 10751: 'Familie', 14: 'Fantasy', 36: 'Historie', 27: 'Horror', 10402: 'Musik', 
            9648: 'Mystery', 10749: 'Romanze', 878: 'Sci-Fi', 10770: 'TV-Film', 53: 'Thriller', 
            10752: 'Krieg', 37: 'Western'
        };

        const NEWS_CATEGORIES = ["Top-News", "Politik", "News", "Sport", "Unterhaltung", "Lifestyle", "Auto", "Ratgeber"];
        const QUERIES = ['Spielfilm', 'Spielfilme', 'Spielfilm-Highlights', 'Filme', 'Kino - Filme'];
        
        let allMovies = [];
        let liveTvChannels = [];
        let allNews = []; // NEU: Speicher für RSS-News
        let moviesToRender = []; 
        let favoriteUrls = JSON.parse(localStorage.getItem('gez_kino_favs') || '[]');
        let currentGenre = 'Alle';
        let currentView = 'mediathek'; 
        let chunkObserver = null;
        let hlsInstance = null;
        let activeVideoErrorHandler = null; 
        let deferredPrompt = null; 
        let activeDownloadUrl = ''; 
        const CHUNK_SIZE = 60; 

        function cleanTitle(title) {
            let yearMatch = title.match(/(\d{4})/);
            let year = yearMatch ? yearMatch[1] : 'None';
            let clean = title;
            const markers = [' - Spielfilm', ' – Spielfilm', ' - Spiellfilm', ' – Spiellfilm', ', Spielfilm', ' Österreich', ', Deutschland', ', Schweiz', ', Belgien', ', Frankreich', ', Spanien', ', Niederlande', ', Irland', ', Luxemburg', ', Italien', ', USA', ', Kosovo', ', Großbritannien', ', Tschechische Republik', ', Norwegen', ', BRD', ', Dänemark', ', Australien', ', Schweden', ', Video:', ', Präsentiert:', ', Kurzfilm', ' Fernsehfilm', ' Heimatfilm', ' - Thriller', ' - Drama', '«', '»'];
            markers.forEach(marker => { clean = clean.split(new RegExp(marker, 'i'))[0]; });
            clean = clean.replace(/^(Spielfilm|Spiellfilm):\s*/i, '');
            clean = clean.replace(/–/g, '-').replace(/—/g, '-');
            clean = clean.replace(/\(.*?\)/g, '');
            return { cleanName: clean.trim().replace(/[ \t,.\-_–—»]+$/, ''), year: year };
        }

        async function fetchAllData() {
            document.getElementById('scanner').classList.remove('hidden');
            const seenUrls = new Set(); const seenTitles = new Set(); let tempResults = [];
            try {
                const promises = QUERIES.map(q => {
                    const payload = { queries: [{ fields: ['topic'], query: q }], size: 2000, sortBy: 'timestamp', sortOrder: 'desc' };
                    return fetch(MEDIATHEK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) }).then(res => res.json()).catch(() => ({ result: { results: [] } }));
                });
                const responses = await Promise.all(promises);
                responses.forEach(data => {
                    (data.result?.results || []).forEach(m => {
                        const url = m.url_video || ''; const title = m.title || ''; if (!url || !title) return;
                        if (/audiodeskription|audio description|ad version|hörfilm|deskription|barrierefrei/.test(title.toLowerCase())) return;
                        if (seenUrls.has(url)) return;
                        const { cleanName, year } = cleanTitle(title); if (!cleanName) return;
                        if (seenTitles.has(cleanName.toLowerCase().trim())) return;
                        if (m.duration < 4680) return;
                        seenUrls.add(url); seenTitles.add(cleanName.toLowerCase().trim());
                        tempResults.push({ title: cleanName, search: cleanName, year: year, video_url: url, plot: 'Lade Filminformationen...', rating: 'N/A', thumb: 'placeholder.png', genres_list: ['Sonstige'], channel: m.channel });
                    });
                });
                allMovies = tempResults.sort((a, b) => a.title.localeCompare(b.title));
                if (allMovies.length === 0 && currentView === 'mediathek') { document.getElementById('statusMessage').innerText = "Keine Filme gefunden."; return; }
                renderGenreLeiste(); filterResults(); hydrateWithTMDBParallel();
            } catch (err) { console.error(err); if (currentView === 'mediathek') document.getElementById('statusMessage').innerText = "Fehler beim API-Abruf."; }
        }

        async function fetchLiveTvData() {
            if (liveTvChannels.length > 0) return;
            document.getElementById('scanner').classList.remove('hidden');
            try {
                const res = await fetch(IPTV_URL); const text = await res.text(); const lines = text.split(/\r?\n/); let currentChannel = null;
                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/); const commaIdx = line.indexOf(',');
                        currentChannel = { title: commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Unbekannter Sender', search: '', year: 'LIVE', video_url: '', plot: 'Live-Stream des öffentlich-rechtlichen Rundfunks über das Kodinerds IPTV-Projekt.', rating: 'TV', thumb: logoMatch ? logoMatch[1] : 'placeholder.png', genres_list: ['Live TV'], channel: 'ÖRR' };
                    } else if (line.startsWith('http') && currentChannel) {
                        currentChannel.video_url = line; currentChannel.search = currentChannel.title; liveTvChannels.push(currentChannel); currentChannel = null;
                    }
                }
                liveTvChannels.sort((a, b) => a.title.localeCompare(b.title));
            } catch (err) { console.error(err); } finally { document.getElementById('scanner').classList.add('hidden'); }
        }

        // NEU: Lädt die von der GitHub Action bereitgestellte news.json
        async function fetchNewsData() {
            if (allNews.length > 0) return;
            document.getElementById('scanner').classList.remove('hidden');
            try {
                const res = await fetch('./news.json');
                allNews = await res.json();
            } catch (err) {
                console.error("Fehler beim News-Laden:", err);
                allNews = [];
                const grid = document.getElementById('movieGrid');
                grid.innerHTML = `<div class="text-center col-span-full py-12 text-red-400 border border-red-900 rounded-xl bg-red-950/20">news.json nicht gefunden.<br><span class="text-xs text-gray-500">Hast du die GitHub Action bereits ausgeführt?</span></div>`;
            } finally {
                document.getElementById('scanner').classList.add('hidden');
            }
        }

        async function switchView(view) {
            if (currentView === view) return;
            currentView = view;
            const btnMedia = document.getElementById('btnMediathek'); const btnTv = document.getElementById('btnLiveTv'); const btnNews = document.getElementById('btnNachrichten'); const searchBar = document.getElementById('searchBar');
            searchBar.value = '';

            [btnMedia, btnTv, btnNews].forEach(b => b.className = "px-5 py-2.5 rounded-xl bg-gray-900 border border-gray-800 text-gray-400 hover:text-white transition-all cursor-pointer text-sm flex-1 sm:flex-none text-center");

            if (view === 'mediathek') {
                btnMedia.className = "px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold shadow-lg transition-all cursor-pointer text-sm flex-1 sm:flex-none text-center";
                currentGenre = 'Alle'; searchBar.placeholder = "Film suchen..."; renderGenreLeiste(); filterResults();
            } else if (view === 'livetv') {
                btnTv.className = "px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold shadow-lg transition-all cursor-pointer text-sm flex-1 sm:flex-none text-center";
                currentGenre = 'Alle'; searchBar.placeholder = "Sender suchen...";
                document.getElementById('movieGrid').innerHTML = `<div id="statusMessage" class="text-center col-span-full py-12 text-gray-400 animate-pulse">Lade Live TV Sender...</div>`;
                await fetchLiveTvData(); renderGenreLeiste(); filterResults();
            } else if (view === 'nachrichten') {
                btnNews.className = "px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold shadow-lg transition-all cursor-pointer text-sm flex-1 sm:flex-none text-center";
                currentGenre = 'Top-News'; searchBar.placeholder = "Artikel suchen...";
                document.getElementById('movieGrid').innerHTML = `<div id="statusMessage" class="text-center col-span-full py-12 text-gray-400 animate-pulse">Lade Nachrichten...</div>`;
                await fetchNewsData(); renderGenreLeiste(); filterResults();
            }
        }

        async function hydrateWithTMDBParallel() {
            const CONCURRENCY_LIMIT = 50; let movieIndex = 0; let loadedCount = 0;
            async function worker() {
                while (movieIndex < allMovies.length) {
                    const currentIdx = movieIndex++; const movie = allMovies[currentIdx]; if (!movie) break;
                    let url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movie.search)}&language=de-DE&include_adult=false`;
                    if (movie.year !== 'None') url += `&year=${movie.year}`;
                    try {
                        const res = await fetch(url); if (res.status === 429) { movieIndex--; await new Promise(r => setTimeout(r, 800)); continue; }
                        const data = await res.json();
                        if (data.results && data.results.length > 0) {
                            const tmdb = data.results[0]; movie.plot = tmdb.overview || 'Keine Beschreibung verfügbar.'; movie.rating = tmdb.vote_average ? tmdb.vote_average.toFixed(1) : 'N/A'; movie.thumb = tmdb.poster_path ? `https://image.tmdb.org/t/p/w342${tmdb.poster_path}` : 'placeholder.png';
                            if (tmdb.release_date && movie.year === 'None') movie.year = tmdb.release_date.split('-')[0];
                            if (tmdb.genre_ids) { movie.genres_list = tmdb.genre_ids.map(id => GENRES_MAP[id]).filter(g => g !== undefined); if (movie.genres_list.length === 0) movie.genres_list = ['Sonstige']; }
                            if (currentView === 'mediathek') updateMovieCard(movie);
                        }
                    } catch (e) {}
                    loadedCount++; if (loadedCount % 15 === 0) updateGenreCounts();
                }
            }
            const workers = Array.from({ length: CONCURRENCY_LIMIT }, worker); await Promise.all(workers); updateGenreCounts(); document.getElementById('scanner').classList.add('hidden');
        }

        function getGenreCounts() {
            const counts = { "Alle": 0, "Sonstige": 0, "Nach Jahren": 0, "⭐ Favoriten": 0 };
            Object.values(GENRES_MAP).forEach(g => counts[g] = 0);
            NEWS_CATEGORIES.forEach(c => counts[c] = 0);

            if (currentView === 'nachrichten') {
                allNews.forEach(n => { if (n.category in counts) counts[n.category]++; if (favoriteUrls.includes(n.video_url)) counts["⭐ Favoriten"]++; });
            } else {
                const currentSet = currentView === 'mediathek' ? allMovies : liveTvChannels;
                currentSet.forEach(m => { counts["Alle"]++; if (favoriteUrls.includes(m.video_url)) counts["⭐ Favoriten"]++; if (currentView === 'mediathek') { if (m.year && m.year !== 'None' && parseInt(m.year) > 1900) counts["Nach Jahren"]++; if (!m.genres_list || m.genres_list.includes('Sonstige')) counts["Sonstige"]++; else m.genres_list.forEach(g => { if (g in counts) counts[g]++; }); } });
            }
            return counts;
        }

        function renderGenreLeiste() {
            const leiste = document.getElementById('genreLeiste'); const counts = getGenreCounts();
            let genres = [];
            if (currentView === 'mediathek') genres = ['Alle', 'Nach Jahren', '⭐ Favoriten', ...Object.values(GENRES_MAP).sort(), 'Sonstige'];
            else if (currentView === 'livetv') genres = ['Alle', '⭐ Favoriten'];
            else if (currentView === 'nachrichten') genres = [...NEWS_CATEGORIES, '⭐ Favoriten'];

            leiste.innerHTML = '';
            genres.forEach(g => {
                const btn = document.createElement('button'); btn.id = `genre-btn-${g.replace(/\s+/g, '').replace(/⭐/g, 'Fav')}`;
                const isActive = currentGenre === g || (g === 'Nach Jahren' && currentGenre.startsWith('Jahr: '));
                btn.className = `flex-shrink-0 min-w-[120px] px-4 py-2 rounded-xl text-center flex flex-col justify-center transition-all cursor-pointer border ${isActive ? 'bg-blue-600 border-blue-500 text-white font-bold' : 'bg-gray-900 border-gray-800 text-gray-300 hover:border-gray-700'}`;
                btn.innerHTML = `<span class="text-sm tracking-wide">${g === currentGenre.replace('Jahr: ', 'Jahr ') ? currentGenre : g}</span><span class="text-[10px] opacity-60 font-light genre-count">${counts[g] !== undefined ? '(' + counts[g] + ')' : ''}</span>`;
                btn.onclick = () => { if (g === 'Nach Jahren') openYearsMenu(); else { currentGenre = g; setActiveGenreStyling(); filterResults(); } };
                leiste.appendChild(btn);
            });
        }

        function updateGenreCounts() {
            const counts = getGenreCounts();
            Object.keys(counts).forEach(g => { const btn = document.getElementById(`genre-btn-${g.replace(/\s+/g, '').replace(/⭐/g, 'Fav')}`); if (btn) { const cs = btn.querySelector('.genre-count'); if (cs) cs.innerText = `(${counts[g]})`; } });
        }

        function setActiveGenreStyling() {
            let genres = currentView === 'mediathek' ? ['Alle', 'Nach Jahren', '⭐ Favoriten', ...Object.values(GENRES_MAP).sort(), 'Sonstige'] : (currentView === 'livetv' ? ['Alle', '⭐ Favoriten'] : [...NEWS_CATEGORIES, '⭐ Favoriten']);
            genres.forEach(g => { const btn = document.getElementById(`genre-btn-${g.replace(/\s+/g, '').replace(/⭐/g, 'Fav')}`); if (!btn) return; const isActive = currentGenre === g || (g === 'Nach Jahren' && currentGenre.startsWith('Jahr: ')); if (isActive) { btn.className = "flex-shrink-0 min-w-[120px] px-4 py-2 rounded-xl text-center flex flex-col justify-center transition-all cursor-pointer border bg-blue-600 border-blue-500 text-white font-bold"; if (currentGenre.startsWith('Jahr: ')) btn.querySelector('span').innerText = currentGenre; } else { btn.className = "flex-shrink-0 min-w-[120px] px-4 py-2 rounded-xl text-center flex flex-col justify-center transition-all cursor-pointer border bg-gray-900 border-gray-800 text-gray-300 hover:border-gray-700"; if (g === 'Nach Jahren') btn.querySelector('span').innerText = 'Nach Jahren'; } });
        }

        function openYearsMenu() {
            const ySet = new Set(); allMovies.forEach(m => { if (m.year && m.year !== 'None' && parseInt(m.year) > 1900) ySet.add(m.year); });
            const grid = document.getElementById('yearsGrid'); grid.innerHTML = '';
            Array.from(ySet).sort((a, b) => b - a).forEach(yr => { const btn = document.createElement('button'); btn.className = "bg-gray-800 hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-all cursor-pointer text-sm"; btn.innerText = yr; btn.onclick = () => { currentGenre = `Jahr: ${yr}`; closeYearsModal(); setActiveGenreStyling(); filterResults(); }; grid.appendChild(btn); });
            document.getElementById('yearsModal').style.display = 'flex';
        }
        function closeYearsModal() { document.getElementById('yearsModal').style.display = 'none'; }

        function filterResults() {
            const query = document.getElementById('searchBar').value.toLowerCase().trim();
            
            if (currentView === 'nachrichten') {
                moviesToRender = allNews.filter(n => {
                    if (query && !n.title.toLowerCase().includes(query) && !n.plot.toLowerCase().includes(query)) return false;
                    if (currentGenre === '⭐ Favoriten') return favoriteUrls.includes(n.video_url);
                    return n.category === currentGenre;
                });
            } else {
                const currentSet = currentView === 'mediathek' ? allMovies : liveTvChannels;
                moviesToRender = currentSet.filter(m => { if (query && !m.title.toLowerCase().includes(query) && !m.plot.toLowerCase().includes(query)) return false; if (currentGenre === 'Alle') return true; if (currentGenre === '⭐ Favoriten') return favoriteUrls.includes(m.video_url); if (currentGenre === 'Sonstige') return !m.genres_list || m.genres_list.includes('Sonstige'); if (currentGenre.startsWith('Jahr: ')) return m.year === currentGenre.replace('Jahr: ', ''); return m.genres_list && m.genres_list.includes(currentGenre); });
            }

            const grid = document.getElementById('movieGrid'); grid.innerHTML = '';
            if (moviesToRender.length === 0) { grid.innerHTML = `<div class="text-center col-span-full py-12 text-gray-500">Keine Inhalte für diese Auswahl vorhanden.</div>`; return; }
            renderNextChunk(0); setupInfiniteScroll();
        }

        function togglePlot(element) { element.classList.toggle('line-clamp-3'); }

        function renderNextChunk(startIndex) {
            const grid = document.getElementById('movieGrid'); const oldSentinel = document.getElementById('scrollSentinel'); if (oldSentinel) oldSentinel.remove();
            const endIndex = Math.min(startIndex + CHUNK_SIZE, moviesToRender.length); const chunk = moviesToRender.slice(startIndex, endIndex); const fragment = document.createDocumentFragment();

            chunk.forEach(m => {
                const card = document.createElement('div'); card.id = `movie-${btoa(encodeURIComponent(m.video_url)).replace(/=/g, '')}`;
                card.className = "bg-gray-900 rounded-xl overflow-hidden shadow-md border border-gray-800 flex flex-col justify-between hover:border-blue-500 transition-all duration-200 group h-fit";
                const isFav = favoriteUrls.includes(m.video_url);

                card.innerHTML = `
                    <div class="relative aspect-[2/3] w-full bg-gray-950 overflow-hidden flex items-center justify-center p-4">
                        <button onclick="toggleFavorite('${m.video_url}', event)" class="fav-btn absolute top-2 left-2 bg-black/70 px-2 py-0.5 text-sm font-bold rounded transition-colors cursor-pointer ${isFav ? 'text-yellow-400 hover:text-gray-400' : 'text-gray-400 hover:text-yellow-400'} z-10">
                            ${isFav ? '★' : '☆'}
                        </button>
                        <img src="${m.thumb}" alt="" class="${currentView === 'livetv' || currentView === 'nachrichten' ? 'max-w-full max-h-full object-contain' : 'w-full h-full object-cover'} group-hover:scale-105 transition-transform duration-300" onerror="this.src='placeholder.png';">
                        <span class="absolute top-2 right-2 bg-black/70 px-2 py-0.5 text-xs font-bold ${currentView === 'livetv' ? 'text-red-500' : (currentView === 'nachrichten' ? 'text-blue-400' : 'text-yellow-400')} rounded">
                            ${currentView === 'livetv' ? '🔴 LIVE' : (currentView === 'nachrichten' ? '📰 NEWS' : '★ ' + m.rating)}
                        </span>
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-sm text-gray-100 line-clamp-2 mb-1 group-hover:text-blue-400 transition-colors" title="${m.title}">${m.title}</h3>
                            <p class="text-gray-500 text-[11px] mb-2">${m.channel} ${m.year !== 'None' ? '· ' + m.year : ''}</p>
                            <p onclick="togglePlot(this)" class="text-gray-400 text-xs line-clamp-3 mb-3 font-light cursor-pointer hover:text-gray-200 transition-colors">${m.plot}</p>
                        </div>
                        <div class="space-y-2">
                            <div class="flex flex-wrap gap-1 mb-2">
                                ${m.genres_list.map(g => `<span class="bg-gray-800 text-gray-400 text-[10px] px-1.5 py-0.5 rounded">${g}</span>`).join('')}
                            </div>
                            <button onclick="openPlayer('${m.video_url}', '${m.title.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded-lg transition-colors text-xs tracking-wide cursor-pointer">
                                ${currentView === 'nachrichten' ? 'LESEN' : 'ABSPIELEN'}
                            </button>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
            if (endIndex < moviesToRender.length) { const sentinel = document.createElement('div'); sentinel.id = 'scrollSentinel'; sentinel.className = 'w-full h-12 col-span-full'; grid.appendChild(sentinel); if (chunkObserver) chunkObserver.observe(sentinel); }
        }

        function setupInfiniteScroll() { if (chunkObserver) chunkObserver.disconnect(); chunkObserver = new IntersectionObserver((entries) => { if (entries[0].isIntersecting) { const cc = document.querySelectorAll('#movieGrid > div:not(#scrollSentinel)').length; if (cc < moviesToRender.length) renderNextChunk(cc); } }, { rootMargin: '400px' }); const sentinel = document.getElementById('scrollSentinel'); if (sentinel) chunkObserver.observe(sentinel); }

        function updateMovieCard(m) { const card = document.getElementById(`movie-${btoa(encodeURIComponent(m.video_url)).replace(/=/g, '')}`); if (!card) return; const img = card.querySelector('img'); if (img && m.thumb !== 'placeholder.png') img.src = m.thumb; const rb = card.querySelector('.text-yellow-400'); if (rb) rb.innerText = `★ ${m.rating}`; const pt = card.querySelector('.p-3 p.text-gray-400'); if (pt) pt.innerText = m.plot; const it = card.querySelector('.text-gray-500'); if (it) it.innerText = `${m.channel} ${m.year !== 'None' ? '· ' + m.year : ''}`; const gb = card.querySelector('.flex-wrap'); if (gb) gb.innerHTML = m.genres_list.map(g => `<span class="bg-gray-800 text-gray-400 text-[10px] px-1.5 py-0.5 rounded">${g}</span>`).join(''); }

        function toggleFavorite(url, event) { if (event) event.stopPropagation(); const idx = favoriteUrls.indexOf(url); if (idx > -1) favoriteUrls.splice(idx, 1); else favoriteUrls.push(url); localStorage.setItem('gez_kino_favs', JSON.stringify(favoriteUrls)); const card = document.getElementById(`movie-${btoa(encodeURIComponent(url)).replace(/=/g, '')}`); if (card) { const btn = card.querySelector('.fav-btn'); const isFav = favoriteUrls.includes(url); if (btn) { btn.innerText = isFav ? '★' : '☆'; btn.className = `fav-btn absolute top-2 left-2 bg-black/70 px-2 py-0.5 text-sm font-bold rounded transition-colors cursor-pointer ${isFav ? 'text-yellow-400 hover:text-gray-400' : 'text-gray-400 hover:text-yellow-400'} z-10`; } } updateGenreCounts(); if (currentGenre === '⭐ Favoriten') filterResults(); }
        function copyVideoUrl() { if (!activeDownloadUrl) return; navigator.clipboard.writeText(activeDownloadUrl).then(() => { const btn = document.getElementById('modalCopyBtn'); const oldText = btn.innerHTML; btn.innerHTML = '✅ Kopiert!'; btn.classList.remove('bg-gray-800', 'text-gray-300'); btn.classList.add('bg-blue-600', 'text-white', 'border-blue-500'); setTimeout(() => { btn.innerHTML = oldText; btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-500'); btn.classList.add('bg-gray-800', 'text-gray-300'); }, 2000); }); }

        async function triggerNativeDownload() {
            const url = activeDownloadUrl; const title = document.getElementById('videoTitle').innerText; const cleanFilename = `${title.replace(/[^a-zA-Z0-9\s-_]/g, '')}.mp4`; const btn = document.getElementById('modalDownloadBtn'); const originalText = btn.innerHTML;
            try {
                if ('showSaveFilePicker' in window) { btn.innerHTML = '⏳ Ordner wählen...'; btn.disabled = true; const handle = await window.showSaveFilePicker({ suggestedName: cleanFilename, types: [{ description: 'Videodatei (MP4)', accept: { 'video/mp4': ['.mp4'] } }] }); btn.innerHTML = '📥 Stream läuft...'; const response = await fetch(url); if (!response.ok) throw new Error('Netzwerkfehler'); const writable = await handle.createWritable(); const reader = response.body.getReader(); while (true) { const { done, value } = await reader.read(); if (done) break; await writable.write(value); } await writable.close(); btn.innerHTML = '✅ Gespeichert!'; btn.disabled = false; setTimeout(() => { btn.innerHTML = originalText; }, 3000); return; }
                btn.innerHTML = '⏳ In Speicher laden...'; btn.disabled = true; const response = await fetch(url); if (!response.ok) throw new Error('Netzwerkfehler'); const blob = await response.blob(); const blobUrl = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = blobUrl; a.download = cleanFilename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(blobUrl); btn.innerHTML = '✅ Bereit!'; btn.disabled = false; setTimeout(() => { btn.innerHTML = originalText; }, 3000);
            } catch (err) { btn.disabled = false; if (err.name === 'AbortError') { btn.innerHTML = originalText; return; } btn.innerHTML = '❌ CORS-Schutz!'; setTimeout(() => { btn.innerHTML = originalText; window.open(url, '_blank'); }, 2000); }
        }

        // Anpassung für die Player/Reader Steuerung
        function openPlayer(url, title) {
            if (currentView === 'nachrichten') {
                // NEU: Öffne den Text-Viewer bei Nachrichten
                const item = allNews.find(n => n.video_url === url);
                if (item) {
                    document.getElementById('textModalTitle').innerText = item.title;
                    document.getElementById('textModalContent').innerText = item.text || item.plot;
                    document.getElementById('textModalLink').href = item.video_url;
                    document.getElementById('textModal').classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                }
                return;
            }

            const modal = document.getElementById('videoModal'); const video = document.getElementById('mainVideoPlayer'); const titleEl = document.getElementById('videoTitle'); const downloadBtn = document.getElementById('modalDownloadBtn'); const copyBtn = document.getElementById('modalCopyBtn');
            activeDownloadUrl = url; titleEl.innerText = title; modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; 
            const isM3u8 = url.includes('.m3u8') || url.endsWith('.m3u8');
            if (currentView === 'mediathek' && !isM3u8) { [downloadBtn, copyBtn].forEach(b => { b.classList.remove('hidden'); b.classList.add('flex'); }); } else { [downloadBtn, copyBtn].forEach(b => { b.classList.add('hidden'); b.classList.remove('flex'); }); }
            if (activeVideoErrorHandler) { video.removeEventListener('error', activeVideoErrorHandler); activeVideoErrorHandler = null; }

            if (isM3u8) {
                if (Hls.isSupported()) { if (hlsInstance) hlsInstance.destroy(); hlsInstance = new Hls({ manifestLoadingTimeOut: 1500, manifestLoadingMaxRetry: 0 }); hlsInstance.on(Hls.Events.ERROR, function (e, d) { if (!hlsInstance) return; if (d.fatal && d.type === Hls.ErrorTypes.NETWORK_ERROR) { hlsInstance.off(Hls.Events.ERROR); window.open(url, '_blank'); closePlayer(); } }); hlsInstance.loadSource(url); hlsInstance.attachMedia(video); }
                else if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = url; activeVideoErrorHandler = () => { if (!video.src || video.src === "" || video.src === window.location.href) return; window.open(url, '_blank'); closePlayer(); }; video.addEventListener('error', activeVideoErrorHandler); }
                else { window.open(url, '_blank'); closePlayer(); }
            } else { if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; } video.src = url; activeVideoErrorHandler = () => { if (!video.src || video.src === "" || video.src === window.location.href) return; window.open(url, '_blank'); closePlayer(); }; video.addEventListener('error', activeVideoErrorHandler); }
            video.play().catch(() => {});
        }

        function closePlayer() { const modal = document.getElementById('videoModal'); const video = document.getElementById('mainVideoPlayer'); activeDownloadUrl = ''; if (activeVideoErrorHandler) { video.removeEventListener('error', activeVideoErrorHandler); activeVideoErrorHandler = null; } video.pause(); if (hlsInstance) { hlsInstance.off(Hls.Events.ERROR); hlsInstance.destroy(); hlsInstance = null; } video.src = ""; modal.classList.add('hidden'); document.body.style.overflow = 'auto'; }
        
        // NEU: Funktionen zum Schließen des Text-Modals
        function closeTextModal() { document.getElementById('textModal').classList.add('hidden'); document.body.style.overflow = 'auto'; }

        document.getElementById('searchBar').addEventListener('input', filterResults);
        fetchAllData();
        
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); }); }
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('btnInstallPWA').classList.remove('hidden'); });
        document.getElementById('btnInstallPWA').addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt = null; document.getElementById('btnInstallPWA').classList.add('hidden'); });
    </script>
