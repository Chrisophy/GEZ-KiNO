name: GEZ Kino Aktualisierung

on:
  schedule:
    # 02:17 UTC entspricht 04:17 Uhr deutscher Sommerzeit
    # Krumme Minutenzahl umgeht Server-Staus bei GitHub
    - cron: '17 2 * * *'
  workflow_dispatch: # Manueller Start-Button

permissions:
  contents: write # Stellt sicher, dass git push erlaubt ist

jobs:
  build-cinema:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Schritt 1 - Mediathek abfragen, TMDB abgleichen & movies.json erzeugen
        run: python gezscraper.py

      - name: Schritt 2 - movies.json explizit hinzufügen und committen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.json
          git commit -m "Automatische Aktualisierung der movies.json" || echo "Keine Änderungen zum Committen"
          git push
