name: GEZ Kino Aktualisierung

on:
  schedule:
    - cron: '0 4 * * *' # Läuft täglich um 4 Uhr morgens
  workflow_dispatch: # Manueller Start-Button

jobs:
  build-cinema:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Schritt 1 - Rohe ZDF/Mediathek-Daten holen (zdfm.json)
        run: python zdfscraper.py

      - name: Schritt 2 - TMDB abgleichen & movies.json erzeugen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python gezscraper.py

      - name: Schritt 3 - Änderungen in GitHub speichern
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ' Automatische Aktualisierung der Filme (zdfm.json & movies.json)'
          file_pattern: |
            zdfm.json
            movies.json
