name: HTML to APK Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Erlaubt manuellen Start per Klick

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Python Compiler Script
      run: python compiler.py

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-html-app
        path: build_output/app/build/outputs/apk/debug/app-debug.apk
