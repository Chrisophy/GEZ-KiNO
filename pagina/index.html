<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-News Reader (Kodi Bridge)</title>
    <style>
        body {
            font-family: Georgia, serif;
            line-height: 1.6;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #111;
            background-color: #fafafa;
        }
        h1 {
            font-size: 2rem;
            border-bottom: 2px solid #111;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 18px 0;
        }
        a {
            color: #0044cc;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            background: #111;
            color: #fff;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
            font-family: inherit;
        }
        button:hover {
            background: #444;
        }
        .article-text {
            white-space: pre-wrap;
            font-size: 1.2rem;
            text-align: justify;
        }
        .loading {
            font-style: italic;
            color: #666;
        }
        .error {
            color: #cc0000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button id="back-btn" style="display: none;" onclick="goBack()">← Zurück</button>
    <h1 id="page-title">Kategorien</h1>
    <div id="content"></div>

    <script>
        // Deine originalen BILD-Kategorien
        const CATEGORIES = {
            "Top-News": "https://www.bild.de/feed/alles.xml",
            "Politik": "https://www.bild.de/rss-feeds/rss-16725492,feed=politik.bild.html",
            "News": "https://www.bild.de/rss-feeds/rss-16725492,feed=news.bild.html",
            "Sport": "https://www.bild.de/rss-feeds/rss-16725492,feed=sport.bild.html",
            "Unterhaltung": "https://www.bild.de/rss-feeds/rss-16725492,feed=unterhaltung.bild.html",
            "Lifestyle": "https://www.bild.de/rss-feeds/rss-16725492,feed=lifestyle.bild.html",
            "Auto": "https://www.bild.de/rss-feeds/rss-16725492,feed=auto.bild.html",
            "Ratgeber": "https://www.bild.de/rss-feeds/rss-16725492,feed=ratgeber.bild.html"
        };

        // Wir tunneln ALLES durch unseren lokalen Python-Server
        const PROXY = "http://localhost:8000/proxy?url="; 
        
        let historyStack = [];
        let currentState = { view: 'categories' };

        window.onload = () => {
            renderState(currentState);
        };

        function changeState(newState) {
            historyStack.push(Object.assign({}, currentState));
            currentState = newState;
            renderState(currentState);
        }

        function goBack() {
            if (historyStack.length > 0) {
                currentState = historyStack.pop();
                renderState(currentState);
            }
        }

        function renderState(state) {
            const content = document.getElementById('content');
            const titleEl = document.getElementById('page-title');
            const backBtn = document.getElementById('back-btn');

            if (state.view === 'categories') {
                backBtn.style.display = 'none';
                titleEl.innerText = "Kategorien";
                
                const ul = document.createElement('ul');
                for (let cat in CATEGORIES) {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = "#";
                    a.textContent = cat;
                    a.onclick = (e) => {
                        e.preventDefault();
                        changeState({ view: 'list', title: cat, feedUrl: CATEGORIES[cat] });
                    };
                    li.appendChild(a);
                    ul.appendChild(li);
                }
                content.innerHTML = '';
                content.appendChild(ul);
            } 
            
            else if (state.view === 'list') {
                backBtn.style.display = 'inline-block';
                titleEl.innerText = state.title;
                content.innerHTML = '<p class="loading">Lade Feed über Python Bridge...</p>';
                
                fetch(PROXY + encodeURIComponent(state.feedUrl))
                    .then(res => {
                        if (!res.ok) throw new Error("HTTP-Fehler " + res.status);
                        return res.text();
                    })
                    .then(rawText => {
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(rawText, "text/xml");
                        const items = xmlDoc.getElementsByTagName("item");
                        
                        if (items.length === 0) {
                            content.innerHTML = "<p>Keine Einträge gefunden.</p>";
                            return;
                        }

                        const ul = document.createElement('ul');
                        for (let i = 0; i < items.length; i++) {
                            const itemTitle = items[i].getElementsByTagName("title")[0]?.textContent || "Ohne Titel";
                            const itemLink = items[i].getElementsByTagName("link")[0]?.textContent || "";
                            
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.href = "#";
                            a.textContent = itemTitle;
                            a.onclick = (e) => {
                                e.preventDefault();
                                changeState({ view: 'article', title: itemTitle, url: itemLink });
                            };
                            li.appendChild(a);
                            ul.appendChild(li);
                        }
                        content.innerHTML = '';
                        content.appendChild(ul);
                    })
                    .catch(err => {
                        content.innerHTML = `<p class="error">Fehler: ${err.message}</p>`;
                    });
            } 
            
            else if (state.view === 'article') {
                backBtn.style.display = 'inline-block';
                titleEl.innerText = state.title;
                content.innerHTML = '<p class="loading">Extrahiere reinen Text...</p>';
                
                fetch(PROXY + encodeURIComponent(state.url))
                    .then(res => {
                        if (!res.ok) throw new Error("HTTP-Fehler " + res.status);
                        return res.text();
                    })
                    .then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, "text/html");
                        
                        // Deine exakten BeautifulSoup Selektoren
                        const selectors = [
                            'article p',
                            '.article-body p',
                            '.txt p',
                            '.post-content p',
                            '[data-key="article"] p'
                        ];
                        
                        let articleText = [];
                        for (let selector of selectors) {
                            const paragraphs = doc.querySelectorAll(selector);
                            if (paragraphs.length > 0) {
                                paragraphs.forEach(p => {
                                    const text = p.textContent.trim();
                                    if (text.length > 40) {
                                        articleText.push(text);
                                    }
                                });
                                if (articleText.length > 0) break;
                            }
                        }
                        
                        if (articleText.length === 0) {
                            content.innerHTML = "<p>Kein lesbarer Artikeltext gefunden. (Möglicherweise BILD+ Paywall-Artikel)</p>";
                        } else {
                            const uniqueLines = [...new Set(articleText)];
                            content.innerHTML = `<div class="article-text">${uniqueLines.join('\n\n')}</div>`;
                        }
                    })
                    .catch(err => {
                        content.innerHTML = `<p class="error">Fehler beim Laden des Artikels: ${err.message}</p>`;
                    });
            }
        }
    </script>
</body>
</html>
